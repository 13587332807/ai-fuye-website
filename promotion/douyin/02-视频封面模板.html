<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音视频封面图生成器 - AI副业指南</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    display: flex; flex-wrap: wrap; gap: 20px; padding: 20px;
    justify-content: center;
  }
  .cover {
    width: 400px; height: 225px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
  }
  .cover .bg {
    position: absolute; inset: 0;
  }
  .cover .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 30px;
  }
  .cover .big-text {
    font-size: 26px; font-weight: 900; color: #fff;
    line-height: 1.3;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  .cover .small-text {
    font-size: 14px; color: rgba(255,255,255,0.85);
    margin-top: 8px;
  }
  .cover .emoji-big {
    font-size: 48px;
    position: absolute;
    right: 20px; bottom: 20px;
  }
  .cover .badge {
    position: absolute; top: 15px; right: 15px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(5px);
    color: #fff; padding: 4px 12px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
  }
  .cover .source {
    position: absolute; bottom: 12px; left: 30px;
    color: rgba(255,255,255,0.6); font-size: 11px;
  }
  h2 { color: #fff; width: 100%; text-align: center; font-size: 15px; margin: 5px 0; }
</style>
</head>
<body>

<h2>🎬 抖音视频封面模板（横版 16:9，400×225）</h2>

    <div class="small-text">普通人也能月入5000+</div>
  </div>
  <div class="emoji-big">💡</div>
  <div class="source">aifuye.net</div>
</div>

<div class="cover">

</div>

<h2>📷 使用方法：浏览器打开 → 截图 → 裁剪为 16:9 → 上传抖音</h2>

</body>
</html>
