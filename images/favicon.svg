<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)"/>

  <!-- Hexagonal neural network nodes -->
  <g opacity="0.3" stroke="#fff" stroke-width="2">
    <circle cx="140" cy="160" r="8"/>
    <circle cx="256" cy="130" r="8"/>
    <circle cx="372" cy="160" r="8"/>
    <circle cx="120" cy="280" r="8"/>
    <circle cx="256" cy="280" r="8"/>
    <circle cx="392" cy="280" r="8"/>
    <circle cx="140" cy="390" r="8"/>
    <circle cx="256" cy="420" r="8"/>
    <circle cx="372" cy="390" r="8"/>

    <line x1="140" y1="160" x2="256" y2="130"/>
    <line x1="256" y1="130" x2="372" y2="160"/>
    <line x1="140" y1="160" x2="120" y2="280"/>
    <line x1="256" y1="130" x2="256" y2="280"/>
    <line x1="372" y1="160" x2="392" y2="280"/>
    <line x1="120" y1="280" x2="256" y2="280"/>
    <line x1="256" y1="280" x2="392" y2="280"/>
    <line x1="120" y1="280" x2="140" y2="390"/>
    <line x1="256" y1="280" x2="140" y2="390"/>
    <line x1="256" y1="280" x2="256" y2="420"/>
    <line x1="256" y1="280" x2="372" y2="390"/>
    <line x1="392" y1="280" x2="372" y2="390"/>
    <line x1="140" y1="390" x2="256" y2="420"/>
    <line x1="256" y1="420" x2="372" y2="390"/>
  </g>

  <!-- Main AI chip shape -->
  <rect x="156" y="200" width="200" height="180" rx="28" fill="rgba(255,255,255,0.95)" stroke="url(#glowGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Inner tech border -->
  <rect x="168" y="212" width="176" height="156" rx="20" fill="none" stroke="rgba(99,102,241,0.2)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- AI text -->
  <text x="256" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="80" font-weight="900" fill="url(#bgGrad)" letter-spacing="4">AI</text>

  <!-- Decorative dots on chip -->
  <circle cx="200" cy="230" r="4" fill="#6366f1"/>
  <circle cx="312" cy="230" r="4" fill="#6366f1"/>
  <circle cx="200" cy="350" r="4" fill="#06b6d4"/>
  <circle cx="312" cy="350" r="4" fill="#06b6d4"/>

  <!-- Small glow dots -->
  <circle cx="256" cy="170" r="5" fill="#fff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="256" cy="440" r="5" fill="#fff" opacity="0.6" filter="url(#glow)"/>
</svg>
